<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Username: <input type="text" id="a"><br>
    Password: <input type="password" id="b"><br>
    <input type="submit" onclick="fun()">
    <script>
        function fun(){
            pat=/^_|^@|^\d/
            u=document.getElementById("a").value
            v=document.getElementById("b").value
            if(u.length==0 || v.length==0 ){
                alert("Can't keep Blank.Please enter Password")
            }
            else if(v.length<6 || v.length>12){
                alert("Must be 6 to 12 digits length")
            }
            else{
                alert("Password is Strong")
            }
            if(pat.test(u)){
                alert("Enter Valid Username")
            }
        }
    </script>
</body>
</html>
