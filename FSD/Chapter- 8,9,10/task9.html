<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="width:100px ; height:100px ; background-color: tomato" onmousedown='fun(event)'></div>
    <script>
        function fun(e) {
            val=e.button
            switch(val){
                case 0: alert("Left click");
                break;
                case 1: alert("Center click");
                break;
                case 2: alert("Right click");
                break;
            }
        }
    </script>
</body>
</html>
