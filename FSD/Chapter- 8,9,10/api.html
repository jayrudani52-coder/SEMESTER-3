<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="getJoke()">Get Joke</button>
    <img id="jokeimg" width="300">
    <Script>
        function getJoke(){
            fetch("https://official-joke-api.appspot.com/random_joke")
            .then(res=>res.json())
            .then(data=>{
                document.getElementById("jokeimg").setAttribute("src",data.message)
                console.log("Question: ",data.setup)
                console.log("Answer: ",data.punchline)
            })
            .catch(error=>{
                console.log("Error: ",error)
            })
        } 
    </Script>
</body>
</html>
