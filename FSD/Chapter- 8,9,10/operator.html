<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fun(a,b,...c){
            console.log(a)
            console.log(b)
            console.log(c)
            console.log(c.length)
            console.log(c[2])
            console.log(c.indexOf(4))
            console.log(c.indexOf(1))
        }
        fun(1,2,3,4,5)
        fun("abc","pqr","xyz","ufo","nato")

        const arr1=[3,2,1]
        const arr2=[4,5]
        const arr=[arr1,arr2]
        console.log(arr)
        console.log(arr.sort())

        const farr=[...arr1,...arr2]
        console.log(farr)
        console.log(farr.sort())
        console.log(...farr)
        console.log(Math.min(...farr))
        console.log(Math.min(farr))
    </script>
</body>
</html>
