    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <div onclick="this.innerHTML='Hello'">Hiii</div>
        <div onmouseover="this.style.color='tomato'">I am on Mouse Over</div>
        <div onmouseout="this.style.backgroundColor='cyan'">Change on Mouse Out</div>
        <div onmousedown="this.style.color='blue'">on Mouse key Press</div>
        <div onmouseup="this.style.color='pink'">on Mouse key Release</div>
    </body>
    </html>
