<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="a">
    <script>
        let input=document.querySelector("#a")
        input.addEventListener("keydown",(e)=>{
            if(isNaN(e.key) && (e.key!=="Backspace")){
                e.preventDefault()
            }
        })
    </script>
</body>
</html>
