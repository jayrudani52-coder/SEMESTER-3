<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --col:blue;
            --bcol:tomato;
        }

        h1{
            --col:purple;
            --fs:50px;
            color:var(--col);
            font-size: var(--fs);
        }

        p{
            color: var(--col);
            background-color: var(--bcol);
        }
    </style>
</head>
<body>
    <h1>Global VS Local</h1>
    <p>Observe my color bgcolor</p>
</body>
</html>
