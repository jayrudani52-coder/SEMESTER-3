<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
    <hr class="bg-warning">
    <h2 class="text-center text-primary">Pizza Shop 2.0</h2>
    <hr class="bg-success">

    <form method="get" action="#" class="bg-light p-4 rounded">
        <fieldset>
            <legend>Customer Detail</legend>
            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label">Name:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="name" placeholder="Enter your Name" maxlength="10">
                </div>
            </div>

            <div class="row mb-3">
                <label for="mobile" class="col-sm-2 col-form-label">Mobile Number:</label>
                <div class="col-sm-10">
                    <input type="tel" class="form-control" id="mobile" placeholder="Enter your Mobile Number" maxlength="10">
                </div>
            </div>

            <div class="row mb-3">
                <label for="address" class="col-sm-2 col-form-label">Address:</label>
                <div class="col-sm-10">
                    <textarea class="form-control" id="address" rows="5" placeholder="Enter your Address"></textarea>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Pizza Topping Detail</legend>
            <div class="row mb-3">
            
                <div class="row m-2">
                    <div class="col-sm-3 ">Pizza Type:</div>
                    <div class="col-sm-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="supreme">
                            <label class="form-check-label" for="supreme">Supreme</label> 
                        </div>
                    </div>
                    <div class="col-sm-2">Quantity:</div>
                    <div class="col-sm-4">
                        <input type="number" class="form-control" min="1" max="10">
                    </div>
                </div>
                <div class="row m-2">
                    <div class="col-sm-3"></div>
                    <div class="col-sm-3">
                        <div class="form-check ">
                            <input class="form-check-input" type="checkbox" id="cheese">
                            <label class="form-check-label" for="cheese">Cheese</label> 
                        </div>
                    </div>
                    <div class="col-sm-2">Quantity:</div>
                    <div class="col-sm-4">
                        <input type="number" class="form-control" min="1" max="10">
                    </div>
                </div>
                <div class="row m-2">
                    <div class="col-sm-3"></div>
                    <div class="col-sm-3">
                        <div class="form-check ">
                            <input class="form-check-input" type="checkbox" id="veg">
                            <label class="form-check-label" for="veg">Veg</label> 
                        </div>
                    </div>
                    <div class="col-sm-2">Quantity:</div>
                    <div class="col-sm-4">
                        <input type="number" class="form-control" min="1" max="10">
                    </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Pizza Size:</label>
                <div class="col-sm-10">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="size" id="small" value="small">
                        <label class="form-check-label" for="small">Small</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="size" id="Medium" value="Medium">
                        <label class="form-check-label" for="Medium">Medium</label>
                    </div> 
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="size" id="Large" value="Large">
                        <label class="form-check-label" for="Large">Large</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="pizzaSauce" class="col-sm-2 col-form-label">Pizza Sauce:</label>
                <div class="col-sm-10">
                    <select class="form-select" id="pizzaSauce">
                        <option value="" selected disabled hidden>--Sauce Type--</option>
                        <option>Tomato</option>
                        <option>Chilly</option>
                        <option>BBQ</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Extra Topping:</label>
                <div class="col-sm-10">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cheese">
                        <label class="form-check-label" for="cheese">Cheese</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="Extra Veg.">
                        <label class="form-check-label" for="Extra Veg.">Extra Veg.</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="Roasted Broccoli">
                        <label class="form-check-label" for="Roasted Broccoli">Roasted Broccoli</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="Black Olives">
                        <label class="form-check-label" for="Black Olives">Black Olives</label>
                    </div>
         
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">Delivery Instruction:</label>
                <div class="col-sm-10">
                    <textarea class="form-control" rows="4"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">Send my order</button>
                </div>
            </div>
        </fieldset>
    </form>
</div>
</body>
</html>
