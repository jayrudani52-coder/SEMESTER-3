<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="carousel slide" data-bs-ride="carousel" data-bs-pause="hover" id="cc">
        <div class="carousel-indicators">
            <button type="button" class="active" data-bs-target="#cc" data-bs-slide-to="0"></button>
            <button type="button" data-bs-target="#cc" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#cc" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="https://placehold.co/800x400?text=A" class="d-block w-100 h-75" height="300px">
                <div class="carousel-caption">
                    <h5>First Slide</h5>
                    <a href="#" class="btn btn-danger">Click me</a>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <img src="https://placehold.co/800x400?text=B" class="d-block w-100 h-75" height="300px">
                <div class="carousel-caption">
                    <h5>Second Slide</h5>
                    <a href="#" class="btn btn-warning">Click me</a>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <img src="https://placehold.co/800x400?text=C" class="d-block w-100 h-75" height="300px">
                <div class="carousel-caption">
                    <h5>Third Slide</h5>
                    <a href="#" class="btn btn-info">Click me</a>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#cc" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#cc" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</body>
</html>
