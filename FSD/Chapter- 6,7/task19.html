<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="accordion" id="parent">
        <div class="accordian-item">
            <div class="accordian-header">
                <button class="accordian-button btn btn-info" data-bs-toggle="collapse" data-bs-target="#c1">Item-1</button>
            </div>
            <div class="accordian-collapse collapse collapse show" id="c1" data-bs-parent="#parent">
                <div class="accordian-body">Data for Item-1</div>
            </div>
        </div>
        <div class="accordian-item">
            <div class="accordian-header">
                <button class="accordian-button collapsed btn btn-success" data-bs-toggle="collapse" data-bs-target="#c2">Item-2</button>
            </div>
            <div class="accordian-collapse collapse collapse" id="c2" data-bs-parent="#parent">
                <div class="accordian-body">Data for Item-2</div>
            </div>
        </div>
        <div class="accordian-item">
            <div class="accordian-header">
                <button class="accordian-button collapsed btn btn-danger" data-bs-toggle="collapse" data-bs-target="#c3">Item-3</button>
            </div>
            <div class="accordian-collapse collapse collapse" id="c3" data-bs-parent="#parent">
                <div class="accordian-body">Data for Item-3</div>
            </div>
        </div>
    </div>
</body>
</html>
