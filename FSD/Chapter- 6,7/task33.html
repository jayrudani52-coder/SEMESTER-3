<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
</head>
<body>
    <div class="container">
        <h2>Floating Label</h2>
            <div class="form-floating">
                <input type="text" class="form-control" placeholder="Username Required" id="name">
                <label class="form-label" for="name">Username</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" placeholder="Password Required" id="pass">
                <label class="form-label" for="pass">Password</label>
            </div>
            <div class="form-floating">
                <textarea class="form-control" placeholder="Message" id="msg" style="height:120px">Enter Message</textarea>
                <label for="msg">Message</label> 
            </div>
            <div class="col-sm-4">
                <button class="btn btn-warning">Submit</button>
            </div>
    </div>
</body>
</html>
