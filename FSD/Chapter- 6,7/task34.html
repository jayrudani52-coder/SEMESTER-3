<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="form-floating">
        <select class="form-select">
            <option selected>---List---</option>
            <option>Ahemdabad</option>
            <option>Surat</option>
        </select>
        <label>Select City</label>
    </div>
    <label>Gender :</label>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="gen">
        <label class="form-check-label">Male</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="gen">
        <label class="form-check-label">Female</label>
    </div>
    <label>Hobbies :</label>
    <br>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chbox">
        <label class="form-check-label">Travelling</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="chbox">
        <label class="form-check-label">Photography</label>
    </div>
    <div class="mb-3">
        <label class="form-label">Agree :</label>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Terms & Condition</label>
        </div>
    </div>
    <label>Range :</label>
    <div class="mb-3">
        <input class="form-range" type="range" min="1" max="10" step="1">
    </div>
    <div class="input-group">
        <span class="input-group-text">Rs.</span>
        <input type="text" class="form-control" placeholder="Amount">
    </div>
    </div>
</body>
</html>
