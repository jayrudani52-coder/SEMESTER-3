<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="accordion" id="abc">

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-danger" data-bs-toggle="collapse" data-bs-target="#t1">Section 1</button></h2>
                    <div id="t1" class="accordion-collapse collapse show" data-bs-parent="#abc">
                        <div class="accordion-body">Content for Section 1 goes here.</div>
                    </div>
                </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-info" data-bs-toggle="collapse" data-bs-target="#t2">Section 2</button></h2>
                    <div id="t2" class="accordion-collapse collapse" data-bs-parent="#abc">
                        <div class="accordion-body">Content for Section 2 goes here.</div>
                    </div>
                </div>
                
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-success" data-bs-toggle="collapse" data-bs-target="#t3">Section 3</button></h2>
                    <div id="t3" class="accordion-collapse collapse" data-bs-parent="#abc">
                        <div class="accordion-body">Content for Section 3 goes here.</div>
                    </div>
            </div>
        </div>
    </div> 
</body>
</html>
