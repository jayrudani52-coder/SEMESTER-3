<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
 div {
 width: 100px;
 height: 50px;
 background-color: lightblue;
 transition: width 1s, height 1s ;
 }
 div:hover {
 width: 200px;
 height: 150px;
 }
 </style>
 <title>Resizable Div</title>
</head>
<body>
 <div></div>
</body>
</html>
