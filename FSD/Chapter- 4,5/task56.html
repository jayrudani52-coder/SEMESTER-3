<html>
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
 @keyframes moveLeftToRight {
 0% {
 transform: translateX(0%);
 }
 100% {
 transform: translateX(100%);
 }
 }
 p {
 color: red;
 font-size: 36px;
 position: absolute;
 animation: moveLeftToRight 8s 1s infinite alternate;
 }
 </style></head>
