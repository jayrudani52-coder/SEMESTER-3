<head>
<style>

}
.name:focus{background-color: lightgreen;}

.gender:active {color: blue;}
button:hover {
font-weight: bold;

}
</style>
</head>

<form>
<label id="name">Name:

</label>

Gender:
<label class="gender"><input type="radio" name="g"> Male</label>
<label class="gender"><input type="radio" name="g"> Female</label><br><br>
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</form>
