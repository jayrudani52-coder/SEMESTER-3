<head>
<style>
div {
width: 100px;
height: 100px;
background: red;
/* Multiple transitions with custom duration, delay, and timing */
transition: width 5s ease-in 1s , height 6s ease-out 0.5s , background-color 7s ease-in-out 2s;
}
div:hover {
width: 200px;
height: 200px;
background-color: blueviolet;
}
</style>
</head>
<body>
<p>Hover over the div element below to see different transitions, delays, and timing
functions:</p>
<div></div>
</body>
</html>
