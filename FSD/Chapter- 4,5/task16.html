<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: tomato;
            margin: 20px;
        }

        .a:hover{transform: translate(100px,100px) rotate(90deg) scale(1.5,1);
        }

        .b:hover{
            transform: rotate(45deg) skewY(30deg);
        }

        .c:hover{
            transform: scaleX(-1);
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="a">Box-A</div>
    <div class="b">Box-B</div>
    <img src="download.jpg" class="c">
</body>
</html>
