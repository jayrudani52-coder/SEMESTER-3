<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 150px;
            width: 150px;
            background-color: tomato;
            margin: 10px;
            float: left;
        }

        .a:hover{
            background-image: linear-gradient(red,green,yellow);
        }

        .b:hover{
            background-image: linear-gradient(lawngreen,cyan,blue);
        }
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
</body>
</html>
