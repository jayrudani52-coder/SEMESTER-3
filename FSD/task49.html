<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 300px;
            width: 300px;
            background-color: pink ;
            margin: 10px;
        }

        .a:hover{background-image: radial-gradient(red,yellow,blue);}
        .b:hover{background-image: radial-gradient(red 10%,yellow 25%,blue 40%);}
        .c:hover{background-image: conic-gradient(red,yellow,blue);}
        .d:hover{background-image: conic-gradient(red 45deg,yellow 90deg,blue 80deg);}
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
</body>
</html>
