<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes demo {
            0%{background-color: tomato; top: 0px; left: 0px}
            100%{background-color: tomato; top: 0px; left: 100%}
        }

        div{
            height: 20px;
            width: 1500px;
            position: relative;
            background-color: cyan;
            animation-name: demo;
            animation-duration: 5s;
            animation-delay: 2s;
            animation-timing-function: ease;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <div><h4>SALE SALE SALE</h4></div>
</body>
</html>
